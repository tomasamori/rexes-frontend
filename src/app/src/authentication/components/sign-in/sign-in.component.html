<div class="container">
    <div class="form-container">
        <form [formGroup]="signInForm" class="form-sign-in">
            <h1>Sign in</h1>
            <mat-form-field appearance="outline" class="sign-in-input">
                <mat-label>Email</mat-label>
                <input matInput autocomplete="off" type="email" formControlName="emailFormControl" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="sign-in-input">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="passwordFormControl" />
                <button mat-icon-button matSuffix (click)="hidePasswordClickEvent($event)"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword()">
                    <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <div *ngIf="errorMessage" class="error-container">
                <mat-error>{{errorMessage}}</mat-error>
            </div>   
            <div class="btn-container">
                <button mat-raised-button [disabled]="!signInForm.valid" (click)="onSubmit()">Sign in</button>
            </div>
        </form>
    </div>
</div>
