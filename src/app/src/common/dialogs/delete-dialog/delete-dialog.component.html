<h2 mat-dialog-title>Delete {{data.entity}}</h2>
<mat-dialog-content>
  Would you like to delete the {{data.entity}}?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>No</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Yes</button>
</mat-dialog-actions>
